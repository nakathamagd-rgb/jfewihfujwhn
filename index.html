<style>
:root{

body[data-theme="ocean"]{--bg1:#062a3f;--bg2:#021420;--ac:#2196f3;--ac2:#29e0d2}

.timerbar{height:7px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;margin-bottom:12px}

.streakchip{position:absolute;top:-14px;inset-inline-end:14px;background:linear-gradient(135deg,var(--gold),#ff8a3d);color:#3a2200;

.node:not(.lock):nth-child(4n+3){background:linear-gradient(160deg,#29e0d2,#3ddc84)}

.lvlrow{display:flex;align-items:center;gap:14px;width:100%;justify-content:center}

.zpill.cur{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}

.mascot-box{text-align:center;padding:30px 26px;border-radius:30px;max-width:340px;animation:mascotIn .5s cubic-bezier(.2,1.4,.4,1)}

.mascot-svg{width:130px;height:130px;animation:mascotDance 1s ease-in-out infinite}

.mascot-say{font-size:18px;font-weight:900;line-height:1.7;margin-top:10px;color:var(--gold);text-shadow:0 0 12px rgba(255,200,80,.4)}

.store-item{display:flex;align-items:center;gap:14px;padding:14px;border-radius:20px;margin-bottom:10px}

select option{background:#1c1440;color:#fff}

    <button class="icon-btn" id="btnSettings" data-snd="mech" title="Settings">⚙️</button>
    <div class="spacer"></div>
    <button class="icon-btn" id="btnStore" data-snd="coin" title="Store">🛍️</button>
    <button class="icon-btn" id="btnCamera" data-snd="cam" title="Camera">📷</button>
    <div class="coinchip">🪙 <span id="coinsHome">0</span></div>
  </div>
  <h1 class="logo" data-i="appName"></h1>
  <p class="center small" style="margin:6px 0 18px" data-i="tagline"></p>
  <div id="welcomeLine" class="center" style="font-weight:800;margin-bottom:14px;color:var(--ac2)"></div>
  <button class="btn btn-primary mode-card" id="btnAlone" style="margin-bottom:14px" data-snd="wave">
    <div><div class="big">📚 <span data-i="studyAlone"></span></div><div class="sub" data-i="studyAloneSub"></div></div>
  </button>
  <button class="btn mode-card" id="btnMap" data-snd="mech" style="margin-bottom:14px;border-color:var(--gold)">
    <div><div class="big">🗺️ <span data-i="mapT"></span></div><div class="sub" data-i="mapSub"></div></div>
  </button>
  <button class="btn mode-card" id="btnFriend" data-snd="wave" style="border-color:var(--ac2)">
    <div><div class="big">👥 <span data-i="studyFriend"></span></div><div class="sub" data-i="studyFriendSub"></div></div>
  </button>
  <div class="glass" style="margin-top:16px;padding:6px 14px 14px">
    <div style="display:flex;align-items:center;gap:8px;padding:12px 2px 6px;font-weight:900">🧑‍🤝‍🧑 <span data-i="friends"></span></div>
    <div id="friendsList"></div>
  </div>
  <div class="footer">✦ <span data-i="dev"></span> ✦<div style="font-size:11px;opacity:.7;margin-top:2px">v2.1</div></div>

<!-- Map -->
<div class="screen" id="scr-map">
  <div class="topbar">
    <button class="icon-btn" id="btnMapBack">🏠</button>
    <div class="spacer"></div>
    <div class="coinchip">🪙 <span id="coinsMap">0</span></div>
  </div>
  <div class="zone-nav" id="zoneNav"></div>
  <div class="glass mapzone" id="zoneBox"></div>
  <div class="center small" style="margin-top:12px" id="mapInfo"></div>
</div>

<!-- Quiz -->
<div class="screen" id="scr-quiz">
  <div class="topbar">
    <button class="icon-btn" id="btnQuitQuiz">✖</button>
    <div class="spacer"></div>
    <div class="streakchip" id="streakChip" style="display:none">🔥 <span id="streakNum">0</span></div>
    <div class="coinchip" id="oppChip" style="display:none">⚔️ <span id="oppName"></span></div>
  </div>
  <div class="dots" id="qDots"></div>
  <div class="timerbar" id="timerBar"><div style="width:100%"></div></div>
  <div class="glass qcard" id="qCard">
    <div class="qtext" id="qText"></div>
  </div>
  <div class="pw-row" id="pwRow">
    <button class="pw-btn" id="pwFifty">✂️ <span id="pwFiftyN">0</span></button>
    <button class="pw-btn" id="pwSkip">⏭️ <span id="pwSkipN">0</span></button>
  </div>
  <div id="optsBox"></div>
  <div id="oppProgress" style="display:none;margin-top:10px">
    <div class="small" style="font-weight:800">⚔️ <span id="oppScoreT">0</span></div>
    <div class="opponent-bar"><div id="oppBar" style="width:0%"></div></div>
  </div>
</div>

<!-- Result -->
<div class="screen" id="scr-result">
  <div style="margin:auto 0;max-width:420px;width:100%" class="center">
    <div class="glass" style="padding:28px">
      <div class="stars-big" id="resStars"></div>
      <h2 id="resTitle" style="margin:12px 0"></h2>
      <div class="score-line"><span data-i="yourScore"></span><b id="resYou">0</b></div>
      <div class="score-line" id="resOppLine" style="display:none"><span id="resOppName"></span><b id="resOpp"></b></div>
      <div class="score-line"><span data-i="coinsEarned"></span><b id="resCoins" style="color:var(--gold)">+0 🪙</b></div>
      <div class="score-line" id="resBestLine"><span data-i="bestStreakT"></span><b id="resBest">0</b></div>
      <div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap">
        <button class="btn btn-primary" id="btnResNext" style="flex:1;min-width:120px" data-i="nextLevel"></button>
        <button class="btn" id="btnResReplay" style="flex:1;min-width:120px" data-i="replay"></button>
        <button class="btn" id="btnResHome" style="flex:1;min-width:120px" data-i="home"></button>
      </div>
    </div>
  </div>
</div>

<!-- Friend room -->
<div class="screen" id="scr-friend">
  <div class="topbar"><button class="icon-btn" id="btnFriendBack">🏠</button><div class="spacer"></div></div>
  <div class="glass" style="padding:20px;margin-bottom:14px">
    <h3 data-i="createRoom" style="margin-bottom:8px"></h3>
    <p class="small" data-i="roomReady" style="margin-bottom:10px"></p>
    <div class="codebox" id="hostCode"></div>
    <button class="btn" id="btnCopyCode" style="margin-top:10px" data-i="copyB"></button>
  </div>
  <div class="glass" style="padding:20px;margin-bottom:14px">
    <h3 data-i="joinRoom" style="margin-bottom:8px"></h3>
    <textarea id="pasteCode" rows="3" data-i-ph="pasteHere" style="font-size:11px;font-family:monospace"></textarea>
    <button class="btn btn-green" id="btnJoin" style="margin-top:10px" data-i="connectB"></button>
    <div id="joinReply" style="display:none;margin-top:10px">
      <p class="small" data-i="sendBack"></p>
      <div class="codebox" id="replyCode"></div>
      <button class="btn" id="btnCopyReply" style="margin-top:8px" data-i="copyB"></button>
    </div>
  </div>
  <div class="glass" style="padding:20px">
    <div id="connStatus" class="center" style="font-weight:800;color:var(--dim)">🔵 <span data-i="waiting"></span></div>

  </div>
</div>

<!-- Store -->
<div class="screen" id="scr-store">

  <h2 class="center" data-i="storeT" style="margin-bottom:14px"></h2>
  <div id="storeList"></div>
</div>

<div class="screen" id="scr-settings">

/* ============ Sounds (WebAudio) ============ */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
const SNDPACK={default:{type:"sine",mult:1},piano:{type:"triangle",mult:1},drops:{type:"sine",mult:1.4},scifi:{type:"sawtooth",mult:1.2}};
function tone(f,dur,type,vol,when){const a=ac();if(!a||!S.sound)return;const o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0.0001,a.currentTime+(when||0));
  g.gain.exponentialRampToValueAtTime(vol||0.15,a.currentTime+(when||0)+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+(when||0)+dur);
  o.connect(g).connect(a.destination);o.start(a.currentTime+(when||0));o.stop(a.currentTime+(when||0)+dur+0.05)}
function click(kind){const p=SNDPACK[S.owned["snd"]||"default"]||SNDPACK.default;
  const base={def:520,mech:340,coin:880,cam:700,wave:440,ok:660,bad:180,win:520}[kind||"def"]||520;
  if(kind==="ok"){[660,830,990].forEach((f,i)=>tone(f*p.mult,0.16,p.type,0.16,i*0.09));return}
  if(kind==="bad"){tone(200,0.22,"square",0.12);tone(150,0.3,"square",0.1,0.1);return}
  if(kind==="win"){[523,659,784,1046].forEach((f,i)=>tone(f,0.22,"triangle",0.16,i*0.13));return}
  if(kind==="coin"){tone(990,0.08,p.type,0.12);tone(1320,0.12,p.type,0.1,0.07);return}
  tone(base*p.mult,0.07,p.type,0.12)}
document.addEventListener("pointerdown",e=>{const b=e.target.closest("button,.switch,.node,.zpill");if(b){click(b.dataset.snd||"def")}},true);

function numToAr(n){n=Math.floor(n);if(n<10)return ONES[n];if(n<20)return TEENS[n-10];
  if(n<100){const t=Math.floor(n/10),o=n%10;return o?ONES[o]+" و"+TENS[t]:TENS[t]}
  if(n<1000){const h=Math.floor(n/100),r=n%100;let s=HUND[h];if(r)s+=" و"+numToAr(r);return s}
  const th=Math.floor(n/1000),r=n%1000;let s;
  if(th===1)s="ألف";else if(th===2)s="ألفان";else if(th<11)s=ONES[th]+" آلاف";else s=numToAr(th)+" ألفًا";
  if(r)s+=" و"+numToAr(r);return s}

function hash(s){let h=5381;for(let i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))|0}return (h>>>0).toString(36)}
let usedSet=null;function usedInit(){usedSet=new Set(S.used)}function markUsed(q){const h=hash(q);usedSet.add(h);S.used.push(h);if(S.used.length>60000)S.used=S.used.slice(-50000)}
function isUsed(q){return usedSet.has(hash(q))}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ri=(r,a,b)=>a+Math.floor(r()*(b-a+1));
const pick=(r,arr)=>arr[Math.floor(r()*arr.length)];
function shuffle(r,arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function mkQ(q,correct,wrongs,r){const opts=shuffle(r,[correct,...wrongs.slice(0,3)]);return{q,opts,a:opts.indexOf(correct)}}
function numOpts(r,correct,spread){const s=new Set([correct]);let guard=0;
  while(s.size<4&&guard++<60){let d=correct+(ri(r,1,spread)*(r()<.5?-1:1));if(d>=0&&!s.has(d))s.add(d)}
  while(s.size<4)s.add(correct+s.size*7+1);
  return shuffle(r,[...s])}
function numQ(r,q,correct,spread){return{q,opts:numOpts(r,correct,spread).map(String),a:-1,_c:correct}}
function finalize(o){if(o.a===-1)o.a=o.opts.indexOf(String(o._c));return o}

const ARABIC_ALPHABET="ابتثجحخدذرزسشصضطظعغفقكلمنهوي".split("");
function genMath(r,tier){
  const kinds=tier<2?["add","sub","mul","cmp","miss","seq"]:tier<5?["add","sub","mul","div","cmp","miss","seq","word"]:["add","sub","mul","div","seq","word","eq","area","pct","pow","frac"];
  const k=pick(r,kinds),M=[20,60,120,500,1000,5000,20000,100000,1000000,10000000][tier];
  if(k==="add"){const a=ri(r,2,M),b=ri(r,2,M);return finalize(numQ(r,`كم يساوي ${a} + ${b} ؟`,a+b,Math.max(2,Math.floor((a+b)*0.15))+1))}
  if(k==="sub"){let a=ri(r,5,M),b=ri(r,2,a);return finalize(numQ(r,`كم يساوي ${a} − ${b} ؟`,a-b,Math.max(2,Math.floor(a*0.15))+1))}
  if(k==="mul"){const mx=tier<2?9:tier<4?12:tier<7?25:99;const a=ri(r,2,mx),b=ri(r,2,mx);return finalize(numQ(r,`كم يساوي ${a} × ${b} ؟`,a*b,Math.max(2,Math.floor(a*b*0.2))+1))}
  if(k==="div"){const b=ri(r,2,12),c=ri(r,2,12),a=b*c;return finalize(numQ(r,`كم يساوي ${a} ÷ ${b} ؟`,c,3))}
  if(k==="cmp"){const a=ri(r,1,M),b=ri(r,1,M);if(a===b)b=a+1;const big=Math.max(a,b);
    return mkQ(`أي عدد أكبر: ${a} أم ${b} ؟`,String(big),[String(Math.min(a,b))],r)}
  if(k==="miss"){const a=ri(r,2,Math.max(5,Math.floor(M/2))),c=ri(r,a+1,a+Math.max(5,Math.floor(M/2)));return finalize(numQ(r,`أكمل: ${a} + ...... = ${c}`,c-a,Math.max(2,Math.floor(c*0.12))+1))}
  if(k==="seq"){const s=ri(r,1,20),d=ri(r,2,9);const arr=[s,s+d,s+2*d,s+3*d];return finalize(numQ(r,`ما العدد التالي في السلسلة: ${arr.join(" ، ")} ، ...... ؟`,s+4*d,d+2))}
  if(k==="word"){const n=ri(r,3,12),p=ri(r,2,9);const tot=n*p;
    const names=["قلم","كتاب","تفاحة","بالون","نجمة","زهرة"];
    return finalize(numQ(r,`لديك ${n} ${pick(r,["صندوق","حقيبة","رفوف"])}، في كل واحد ${p} ${pick(r,names)}. كم المجموع؟`,tot,Math.max(2,Math.floor(tot*0.2))+1))}
  if(k==="eq"){if(r()<.5){const x=ri(r,2,30),a=ri(r,1,40);return finalize(numQ(r,`أوجد قيمة x:  x + ${a} = ${x+a}`,x,4))}
    else{const x=ri(r,2,12),a=ri(r,2,9);return finalize(numQ(r,`أوجد قيمة x:  ${a} × x = ${a*x}`,x,3))}}
  if(k==="area"){const w=ri(r,2,20),h=ri(r,2,20);if(r()<.5)return finalize(numQ(r,`مستطيل عرضه ${w} سم وطوله ${h} سم. ما مساحته؟`,w*h,Math.max(3,Math.floor(w*h*0.25))+1));
    return finalize(numQ(r,`مستطيل عرضه ${w} سم وطوله ${h} سم. ما محيطه؟`,2*(w+h),Math.max(3,Math.floor((w+h)*0.3))+1))}
  if(k==="pct"){const p=pick(r,[10,20,25,50,75]),n=ri(r,2,20)*10;return finalize(numQ(r,`كم يساوي ${p}% من ${n} ؟`,Math.round(n*p/100),Math.max(2,Math.floor(n*0.1))+1))}
  if(k==="pow"){const x=ri(r,2,15);return finalize(numQ(r,`كم يساوي ${x}² ؟`,x*x,Math.max(3,Math.floor(x*2))))}
  if(k==="frac"){const d=ri(r,2,12),n1=ri(r,1,d-1),n2=ri(r,1,d-n1);
    return finalize(numQ(r,`كم يساوي ${n1}/${d} + ${n2}/${d} ؟`,n1+n2,2))}}
/* ---- Arabic ---- */
function genArabic(r,tier){
  const k=pick(r,["ltr","ltr","spell","syn","ant","pos","numw","madd","first"]);
  if(k==="ltr"){const w=pick(r,AR_WORDS);return finalize(numQ(r,`كم عدد حروف كلمة «${w}» ؟`,w.length,2))}
  if(k==="first"){const w=pick(r,AR_WORDS);const c=w[0];
    const wrongs=shuffle(r,ARABIC_ALPHABET.filter(x=>x!==c)).slice(0,3);return mkQ(`بأي حرف تبدأ كلمة «${w}» ؟`,c,wrongs,r)}
  if(k==="ltr2"){const i=ri(r,0,ARABIC_ALPHABET.length-2);return mkQ(`ما الحرف الذي يأتي بعد حرف «${ARABIC_ALPHABET[i]}» في الهجاء العربية؟`,ARABIC_ALPHABET[i+1],shuffle(r,ARABIC_ALPHABET.filter(x=>x!==ARABIC_ALPHABET[i+1])).slice(0,3),r)}
  if(k==="spell"){const i=ri(r,0,AR_SPELL.length-1);const[bad,good]=AR_SPELL[i];
    const wrongs=shuffle(r,AR_SPELL.filter((p,j)=>j!==i).map(p=>p[0])).slice(0,3);return mkQ("أي كلمة مكتوبة بشكل صحيح؟",good,wrongs,r)}
  if(k==="syn"){const i=ri(r,0,AR_SYN.length-1);const[w,s]=AR_SYN[i];
    const wrongs=shuffle(r,AR_SYN.filter((p,j)=>j!==i).map(p=>p[1])).slice(0,3);return mkQ(`ما مرادف كلمة «${w}» ؟`,s,wrongs,r)}
  if(k==="ant"){const i=ri(r,0,AR_ANT.length-1);const[w,a]=AR_ANT[i];
    const wrongs=shuffle(r,AR_ANT.filter((p,j)=>j!==i).map(p=>p[1])).slice(0,3);return mkQ(`ما مضاد كلمة «${w}» ؟`,a,wrongs,r)}
  if(k==="pos"){const askVerb=r()<.5;const correct=askVerb?pick(r,AR_POS_VERB):pick(r,AR_POS_NOUN);
    const wrongs=shuffle(r,askVerb?AR_POS_NOUN:AR_POS_VERB).slice(0,3);
    return mkQ(askVerb?"أي الكلمات التالية فعل مضارع؟":"أي الكلمات التالية اسم؟",correct,wrongs,r)}
  if(k==="numw"){const n=ri(r,1,tier<3?20:tier<6?99:999);const c=numToAr(n);
    const wrongs=shuffle(r,[numToAr(n+1),numToAr(Math.max(0,n-1)),numToAr(n+ri(r,2,9))]).filter(x=>x!==c).slice(0,3);
    return mkQ(`كيف يُكتب العدد ${n} بالكلمات؟`,c,wrongs,r)}
  if(k==="madd"){const withA=AR_WORDS.filter(w=>w.includes("ا")),noA=AR_WORDS.filter(w=>!w.includes("ا"));
    if(withA.length&&noA.length>=3)return mkQ("أي كلمة تحتوي على مدّ بالألف؟",pick(r,withA),shuffle(r,noA).slice(0,3),r)}
  return genArabic(r,tier)}

  if(k==="day"){const i=ri(r,0,6);const c=EN_DAYS[(i+1)%7];
    const wrongs=EN_DAYS.filter(d=>d!==c&&d!==EN_DAYS[i]).slice(0,3);return mkQ(`Which day comes after "${EN_DAYS[i]}" ?`,c,wrongs,r)}
  if(k==="month"){const i=ri(r,0,11);const c=EN_MONTHS[(i+1)%12];
    const wrongs=EN_MONTHS.filter(m=>m!==c&&m!==EN_MONTHS[i]).slice(0,3);return mkQ(`Which month comes after "${EN_MONTHS[i]}" ?`,c,wrongs,r)}}
/* ---- Science / Geo / History / Islam ---- */
function bankQ(r,bank,fallback){
  const start=ri(r,0,bank.length-1);
  for(let i=0;i<bank.length;i++){const item=bank[(start+i)%bank.length];
    if(!isUsed(item[0]))return mkQ(item[0],item[1],item[2],r)}
  return fallback(r)}
function genScience(r,tier){
  return bankQ(r,SCIENCE,rr=>{
    const k=pick(rr,["animal","planet","conv","animal2"]);
    if(k==="animal"){const a=pick(rr,ANIMALS);const wrongs=shuffle(rr,["ثديي","طائر","زاحف","برمائي","حشرة","سمك"].filter(x=>x!==a[1])).slice(0,3);
      return mkQ(`إلى أي فئة ينتمي «${a[0]}» ؟`,a[1],wrongs,rr)}
    if(k==="animal2"){const cls=pick(rr,["ثديي","طائر","زاحف"]);const right=ANIMALS.filter(a=>a[1]===cls),wrong=ANIMALS.filter(a=>a[1]!==cls);
      return mkQ(`أي الحيوانات التالية «${cls}» ؟`,pick(rr,right)[0],shuffle(rr,wrong).slice(0,3),rr)}
    if(k==="planet"){const i=ri(rr,0,PLANETS.length-2);return mkQ(`ما الكوكب الذي يأتي بعد «${PLANETS[i]}» في المجموعة الشمسية؟`,PLANETS[i+1],shuffle(rr,PLANETS.filter(p=>p!==PLANETS[i+1]&&p!==PLANETS[i])).slice(0,3),rr)}
    const big=ri(rr,2,30),unit=pick(rr,["كيلومتر","كيلوغرام","ساعة"]);
    const factor=unit==="كيلومتر"?1000:unit==="كيلوغرام"?1000:60;
    const small=unit==="ساعة"?"دقيقة":"متر";
    const smallName=unit==="كيلوغرام"?"غرام":small;
    return finalize(numQ(rr,`كم ${smallName} في ${big} ${unit} ؟`,big*factor,Math.max(50,big*100)))})}
function genGeo(r,tier){
  return bankQ(r,GEO_CAP.concat(GEO_FACTS),rr=>{
    const i=ri(rr,0,GEO_CAP.length-1);const[c,cap]=GEO_CAP[i];
    const wrongs=shuffle(rr,GEO_CAP.filter((p,j)=>j!==i).map(p=>p[1])).slice(0,3);
    return mkQ(`ما عاصمة «${c}» ؟`,cap,wrongs,rr)})}
function genHistory(r,tier){
  return bankQ(r,HIST,rr=>{const y=ri(rr,100,2020);const c=Math.floor((y-1)/100)+1;
    const cAr=["الأول","الثاني","الثالث","الرابع","الخامس","السادس","السابع","الثامن","التاسع","العاشر","الحادي عشر","الثاني عشر","الثالث عشر","الرابع عشر","الخامس عشر","السادس عشر","السابع عشر","الثامن عشر","التاسع عشر","العشرون","الحادي والعشرون"][c-1]||String(c);
    const wrongs=shuffle(rr,[c+1,c-1,c+2].filter(x=>x>=1).map(x=>String(x))).slice(0,3);
    return mkQ(`في أي قرن ميلادي كان عام ${y}م ؟`,cAr,wrongs,rr)})}
function genIslam(r,tier){
  return bankQ(r,ISLAM,rr=>{const i=ri(rr,0,3);const order=["الفجر","الظهر","العصر","المغرب","العشاء"];
    const k=pick(rr,["after","rakat"]);if(k==="after"){const c=order[i+1];
      return mkQ(`أي صلاة تأتي بعد صلاة «${order[i]}» ؟`,c,shuffle(rr,order.filter(x=>x!==c&&x!==order[i])).slice(0,3),rr)}
    const rakat={"الفجر":2,"الظهر":4,"العصر":4,"المغرب":3,"العشاء":4};const p=order[i];
    return finalize(numQ(rr,`كم عدد ركعات صلاة «${p}» ؟`,rakat[p],2))})}
function genFor(subject,r,tier){
  switch(subject){case"math":return genMath(r,tier);case"arabic":return genArabic(r,tier);
    case"english":return genEnglish(r,tier);case"science":return genScience(r,tier);
    case"geo":return genGeo(r,tier);case"history":return genHistory(r,tier);case"islam":return genIslam(r,tier)}}
function genQuestion(level,idx){
  const subject=subjectFor(level,idx),tier=tierOf(level);
  for(let tries=0;tries<50;tries++){
    const r=mulberry32(level*7919+idx*104729+tries*31337);
    let q;try{q=genFor(subject,r,tier)}catch(e){q=genMath(r,tier)}
    if(!isUsed(q.q+"|"+q.opts.join(",")))return q}
  const r=mulberry32(Date.now()%100000+level+idx);return genMath(r,tier)}
function getLevelQuestions(level){const qs=[];for(let i=0;i<10;i++){const q=genQuestion(level,i);markUsed(q.q+"|"+q.opts.join(","));qs.push(q)}save();return qs}
function getDuelQuestions(seed){const qs=[];const usedBackup=usedSet;usedSet=new Set();
  for(let i=0;i<10;i++){const r=mulberry32(seed+i*99991);let q;try{q=genFor(SUBJ_LIST[i%SUBJ_LIST.length],r,3)}catch(e){q=genMath(r,3)}
    if(!qs.some(x=>x.q===q.q))qs.push(q)}usedSet=usedBackup;return qs}

function zoneHue(z){return (z*47)%360}
function renderMap(){
  if(typeof S.level!=="number"||!(S.level>=1)||S.level>4501){S.level=1;save()}
  const LVL=S.level;
  const zn=$("#zoneNav");
  zn.innerHTML=`<button class="zpill" id="zPrev">‹</button><div class="zpill cur">${t("zone")} ${mapZone+1} / 90</div><button class="zpill" id="zNext">›</button>`;
  $("#zPrev").onclick=()=>{if(mapZone>0){mapZone--;renderMap()}};
  $("#zNext").onclick=()=>{if(mapZone<89){mapZone++;renderMap()}};
  const done=S.stars;
  const first=mapZone*50+1,last=Math.min(4500,(mapZone+1)*50);
  const ROWH=78,PAD=56;
  let nodes="",pts=[];
  for(let n=first;n<=last;n++){
    const i=n-first;
    const x=50+36*Math.sin(i*0.62);
    const y=PAD+i*ROWH;
    pts.push([x,y]);
    const st=done[n]||0;
    const isBoss=n%10===0;
    const isCur=n===LVL;
    const locked=n>LVL;
    let cls="pnode"+(isBoss?" boss":"")+(st>0?" done":"")+(locked?" lock":"")+(isCur?" cur":"");
    let inner=locked?"🔒":(isCur?"▶":n);
    if(st>0)inner+=`<span class="pst">${"★".repeat(st)}</span>`;
    if(isCur)inner+=`<span class="plbl">${t("level")} ${n}</span>`;
    nodes+=`<button class="${cls}" data-lvl="${n}" ${locked?"disabled":""} style="left:${x}%;top:${y}px">${inner}</button>`}
  const H=PAD+(last-first)*ROWH+PAD;
  let d="";
  pts.forEach((p,i)=>{d+=(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)+" "});
  const svg=`<svg class="pathline" viewBox="0 0 100 ${H}" preserveAspectRatio="none">
    <path d="${d}" fill="none" stroke="var(--ac2)" stroke-opacity=".55" stroke-width="5" stroke-dasharray="1 7" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
  $("#zoneBox").innerHTML=`<div class="zone-head"><div class="planet" style="filter:hue-rotate(${zoneHue(mapZone)}deg)"></div>
    <div style="flex:1"><b style="font-size:18px">${t("zone")} ${mapZone+1}</b><div class="small">${t("level")} ${first} - ${last}</div></div>
    <button class="btn btn-gold startbar" id="btnGoCur" style="width:auto;padding:12px 20px">▶ ${t("level")} ${LVL}</button></div>
    <div class="pathwrap" style="height:${H}px">${svg}${nodes}</div>`;
  $("#mapInfo").textContent=`⭐ ${Object.keys(S.stars).length} / 4500 ${t("level")}`;
  $("#btnGoCur").onclick=()=>startLevel(LVL);
  $$("#zoneBox .pnode").forEach(b=>b.onclick=()=>{const n=+b.dataset.lvl;if(n<=LVL)startLevel(n);else toast(t("needPrev"))})}

function finishQuiz(){
  stopTimer();const c=QZ.correct,tot=QZ.qs.length;
  let stars=c===tot?3:c>=8?2:c>=6?1:0;
  const coins=c*5+stars*10;S.coins+=coins;
  let title,oppScore=null;
  if(QZ.mode==="duel"){DUEL.myScore=c;dcSend({t:"end",score:c});DUEL.myDone=true;
    if(DUEL.oppDone){oppScore=DUEL.oppScore;
      title=c>oppScore?t("duelWin"):c<oppScore?t("duelLose"):t("duelTie");
      if(DUEL.oppScore<0)oppScore=null}
    else title=t("waiting")}
  else{if(QZ.mode==="solo"&&stars>0){if(!S.stars[QZ.level]||S.stars[QZ.level]<stars)S.stars[QZ.level]=stars;
      if(QZ.level===S.level)S.level=Math.min(4501,S.level+1)}
    title=c===tot?t("perfect"):stars>0?t("lvlDone"):t("youLose")}
  save();show("scr-result");
  $("#resStars").textContent="⭐".repeat(stars)+"☆".repeat(3-stars);
  $("#resTitle").textContent=title;
  $("#resYou").textContent=`${c} / ${tot}`;
  $("#resCoins").textContent=`+${coins} 🪙`;
  $("#resBest").textContent=S.best;
  $("#resBestLine").style.display=QZ.mode==="solo"?"flex":"none";
  if(oppScore!==null&&QZ.mode==="duel"&&DUEL.oppDone){$("#resOppLine").style.display="flex";
    $("#resOppName").textContent=DUEL.peerName||t("oppScore");$("#resOpp").textContent=DUEL.oppScore+" / 10"}
  else $("#resOppLine").style.display="none";
  $("#btnResNext").style.display=(QZ.mode==="solo"&&stars>0)?"flex":"none";
  click(stars>0?"win":"bad");
  if(stars>=2)confetti(stars===3?90:45);
  if(QZ.mode==="duel"&&DUEL.oppName&&!S.friends.includes(DUEL.oppName)){S.friends.push(DUEL.oppName);save()}}

$("#swRemind").onclick=()=>{S.remind=!S.remind;if(S.remind){askNotify();S.lastRemind=Date.now();save();toast("🔔 "+t("remindT"))}save();renderSettings()};
$("#btnReset").onclick=()=>{if(confirm(t("resetQ"))){localStorage.removeItem("najoom_v1");location.reload()}};
/* ============ Friend duel (WebRTC) ============ */
const DUEL={pc:null,dc:null,isHost:false,myScore:0,oppScore:0,myDone:false,oppDone:false,peerName:"",facing:"environment"};
const enc=s=>btoa(unescape(encodeURIComponent(s))),dec=s=>decodeURIComponent(escape(atob(s.trim())));
function dcSend(o){if(DUEL.dc&&DUEL.dc.readyState==="open"){try{DUEL.dc.send(JSON.stringify(o))}catch(e){}}}
function waitIce(pc){return new Promise(res=>{if(pc.iceGatheringState==="complete")return res();
  const to=setTimeout(res,3500);pc.addEventListener("icegatheringstatechange",()=>{if(pc.iceGatheringState==="complete"){clearTimeout(to);res()}})})}
const RTC_CFG={iceServers:[{urls:"stun:stun.l.google.com:19302"}]};
function newPC(){const pc=new RTCPeerConnection(RTC_CFG);DUEL.pc=pc;return pc}
function bindDC(dc){DUEL.dc=dc;
  dc.onopen=()=>{$("#connStatus").innerHTML="🟢 "+t("connectedT");
    if(DUEL.isHost)$("#btnStartDuel").disabled=false;else $("#btnStartDuel").textContent=t("waiting");
    dcSend({t:"hi",name:S.name});click("coin")};
  dc.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}
    if(m.t==="hi"){DUEL.peerName=m.name;$("#oppName").textContent=m.name;
      if(!S.friends.includes(m.name)){S.friends.push(m.name);save();if($("#scr-home").classList.contains("active"))enterHome()}}
    if(m.t==="prog"){$("#oppScoreT").textContent=DUEL.oppScore=m.i+1;$("#oppBar").style.width=((m.i+1)*10)+"%"}
    if(m.t==="end"){DUEL.oppDone=true;DUEL.oppScore=m.score;
      if(DUEL.myDone)updateDuelResult()}
    if(m.t==="start"){startDuel(getDuelQuestions(m.seed))}}}
async function createHostRoom(){try{DUEL.isHost=true;
  const pc=newPC();const dc=pc.createDataChannel("game");bindDC(dc);
  const offer=await pc.createOffer();await pc.setLocalDescription(offer);await waitIce(pc);
  $("#hostCode").textContent=enc(JSON.stringify(pc.localDescription));
  $("#connStatus").innerHTML="🔵 "+t("waiting")}catch(e){$("#hostCode").textContent="Error: "+e.message}}
async function joinAsGuest(code){try{DUEL.isHost=false;
  const pc=newPC();pc.ondatachannel=e=>bindDC(e.channel);
  await pc.setRemoteDescription(JSON.parse(dec(code)));
  const ans=await pc.createAnswer();await pc.setLocalDescription(ans);await waitIce(pc);
  $("#joinReply").style.display="block";$("#replyCode").textContent=enc(JSON.stringify(pc.localDescription))}catch(e){toast("Error: "+e.message)}}
async function acceptReply(code){try{await DUEL.pc.setRemoteDescription(JSON.parse(dec(code)));toast(t("connectedT"))}catch(e){toast("Error: "+e.message)}}
function updateDuelResult(){if(!$("#scr-result").classList.contains("active"))return;
  if(DUEL.oppScore<0){$("#resOppLine").style.display="flex";$("#resOppName").textContent=DUEL.peerName;$("#resOpp").textContent="—";return}
  $("#resOppLine").style.display="flex";$("#resOppName").textContent=DUEL.peerName||t("oppScore");$("#resOpp").textContent=DUEL.oppScore+" / 10";
  const c=DUEL.myScore,o=DUEL.oppScore;
  $("#resTitle").textContent=c>o?t("duelWin"):c<o?t("duelLose"):t("duelTie")}
function hostStart(){const seed=(Date.now()%1000000000)|0;dcSend({t:"start",seed});startDuel(getDuelQuestions(seed))}
$("#btnStartDuel").onclick=()=>{if(DUEL.isHost&&DUEL.dc&&DUEL.dc.readyState==="open")hostStart()};
function openFriend(){show("scr-friend");$("#btnStartDuel").disabled=true;
  if(!DUEL.pc)createHostRoom()}
$("#btnJoin").onclick=()=>{const v=$("#pasteCode").value.trim();if(!v)return;click("mech");
  if(DUEL.pc&&DUEL.isHost)acceptReply(v);else if(!DUEL.pc)joinAsGuest(v)};
$("#btnCopyCode").onclick=()=>copyText($("#hostCode").textContent);
$("#btnCopyReply").onclick=()=>copyText($("#replyCode").textContent);
function copyText(txt){if(!txt)return;
  if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast("📋 "+t("copied")));
  else{const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();toast("📋 "+t("copied"))}}
/* ---- Invite modal ---- */
function showModal(html){let m=$("#dynModal");if(!m){m=document.createElement("div");m.id="dynModal";m.className="modal-back";document.body.appendChild(m)}
  m.innerHTML=`<div class="glass modal">${html}</div>`;m.classList.add("show");return m}
async function inviteFriend(name){if(!DUEL.pc||!$("#hostCode").textContent)await createHostRoom();const m=showModal(`<h3>✉️ ${esc(name)}</h3>
  <p style="font-size:17px;font-weight:800;line-height:1.8;margin-bottom:14px">${t("inviteMsg")}</p>
  <p class="small" style="margin-bottom:8px">${t("shareCode")}</p>
  <div class="codebox" id="invCode" style="max-height:80px">${$("#hostCode").textContent||""}</div>
  <div style="display:flex;gap:10px;margin-top:12px">
    <button class="btn btn-primary" id="invCopy">${t("copyB")}</button>
    <button class="btn" id="invClose">${t("closeB")}</button></div>`);
  $("#invCopy",m).onclick=()=>copyText($("#invCode").textContent);
  $("#invClose",m).onclick=()=>m.classList.remove("show")}
document.addEventListener("click",e=>{const b=e.target.closest("[data-inv]");if(b)inviteFriend(S.friends[+b.dataset.inv])});
/* ============ Camera ============ */
let camStream=null;
async function openCamera(){show("scr-camera");renderCustom();
  try{stopCam();camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:DUEL.facing}});$("#camVideo").srcObject=camStream}
  catch(e){$("#videoWrap").innerHTML=`<div class="center small" style="padding:40px 16px">📷⚠️<br>Camera unavailable</div>`}}
function stopCam(){if(camStream){camStream.getTracks().forEach(tr=>tr.stop());camStream=null}}
$("#btnCamBack").onclick=()=>{stopCam();show("scr-home");enterHome()};
$("#btnFlip").onclick=()=>{DUEL.facing=DUEL.facing==="environment"?"user":"environment";openCamera()};
$("#btnShot").onclick=()=>{const v=$("#camVideo");if(!v||!v.videoWidth){toast("📷 ⚠️");return}
  const c=document.createElement("canvas");const w=520,h=Math.round(v.videoHeight/v.videoWidth*520);
  c.width=w;c.height=h;c.getContext("2d").drawImage(v,0,0,w,h);
  const data=c.toDataURL("image/jpeg",0.55);
  const img=$("#camShot");img.src=data;img.style.display="block";v.style.display="none";
  $("#builderBox").style.display="block";click("cam")};
$("#btnSaveCQ").onclick=()=>{const q=$("#cqText").value.trim(),o=[$("#cqO1").value.trim(),$("#cqO2").value.trim(),$("#cqO3").value.trim(),$("#cqO4").value.trim()].filter(x=>x);
  if(!q||o.length<2){toast("⚠️");return}
  const a=Math.min(3,+$("#cqCorrect").value);
  S.custom.push({q,o,a});save();toast("✅ "+t("saved"));click("coin");
  ["cqText","cqO1","cqO2","cqO3","cqO4"].forEach(id=>$("#"+id).value="");renderCustom()};
function renderCustom(){const l=$("#customList");
  if(!S.custom.length){l.innerHTML=`<div class="small" style="padding:8px 2px">${t("noCustom")}</div>`;return}
  l.innerHTML=S.custom.map((c,i)=>`<div class="friend-item glass"><b style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.q)}</b>
    <button class="buyb owned" data-del="${i}">🗑️</button></div>`).join("");
  $$("[data-del]").forEach(b=>b.onclick=()=>{S.custom.splice(+b.dataset.del,1);save();renderCustom()})}
$("#btnPlayCustom").onclick=()=>startCustom();
/* ---- Study reminder (every 4 hours) ---- */
function askNotify(){try{if("Notification" in window&&Notification.permission==="default")Notification.requestPermission()}catch(e){}}
function fireRemind(){S.lastRemind=Date.now();save();const msg=t("remindMsg");
  let shown=false;
  try{if("Notification" in window&&Notification.permission==="granted"){
    new Notification((T[S.lang]&&T[S.lang].appName)||"Knowledge Stars",{body:msg});shown=true}}catch(e){}
  if(!shown)toast(msg);
  click("win")}
function remindDue(){return S.lastRemind&&Date.now()-S.lastRemind>=4*60*60*1000}
let remindInt=setInterval(()=>{if(S.remind&&remindDue())fireRemind()},60*1000);
setTimeout(()=>{if(S.remind&&remindDue())fireRemind()},20000);
/* ============ Init & wiring ============ */
$("#btnAgree").onclick=()=>{S.agreed=true;save();show("scr-name");click("ok")};
$("#btnDisagree").onclick=()=>{click("mech");try{window.close()}catch(e){}
  setTimeout(()=>{document.body.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;height:100dvh;font-size:20px;font-weight:800;text-align:center;padding:20px">🔒<br><br>يمكنك الآن إغلاق هذه الصفحة.<br>You can close this page now.</div>`},300)};
$("#btnStart").onclick=()=>{const v=$("#nameInput").value.trim();if(!v){$("#nameInput").style.borderColor="var(--rose)";return}
  S.name=v.slice(0,20);save();click("win");askNotify();enterHome();toast(`🌟 ${t("welcomeBack")}، ${S.name}!`)};
$("#btnAlone").onclick=()=>{if(typeof S.level!=="number"||!(S.level>=1))S.level=1;startLevel(S.level)};
$("#btnMap").onclick=openMap;
$("#btnFriend").onclick=openFriend;
$("#btnSettings").onclick=openSettings;
$("#btnStore").onclick=openStore;
$("#btnCamera").onclick=openCamera;
$("#btnMapBack").onclick=()=>{show("scr-home");enterHome()};
$("#btnSetBack").onclick=()=>{show("scr-home");enterHome()};
$("#btnStoreBack").onclick=()=>{show("scr-home");enterHome()};
$("#btnFriendBack").onclick=()=>{show("scr-home");enterHome()};
load();usedInit();
document.body.dataset.theme=S.theme;document.body.dataset.shape=S.shape;
applyI18n();
if(!S.agreed){/* privacy stays */}
else if(!S.name)show("scr-name");
else enterHome();
</script>
